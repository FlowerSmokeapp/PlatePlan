<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlatePlan</title>
<script>
  // On phones (or when opened from the home screen) go straight to the app.
  (function () {
    var standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    var phone = matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) < 820;
    if (standalone || phone) location.replace("app.html");
  })();
</script>
<meta name="theme-color" content="#FAF4E8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700&display=swap" rel="stylesheet">
<style>
/* Desktop: the app shown inside a phone frame. */
:root{
  --bg:#F3EAD8; --ink:#2A281F; --muted:#6E6758; --accent:#2F6143; --sun:#F2B330; --card:#FFFDF8;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 20% 0%,#FCEBC2 0%,transparent 60%),var(--bg);color:var(--ink);font:16px/1.55 var(--body);display:grid;place-items:center;padding:16px}
.stage{display:grid;place-items:center;width:100%;height:100%}
.phone{height:calc(100% - 8px);aspect-ratio:9/19;max-width:100%;background:#1D1B17;border-radius:clamp(36px,6vh,60px);padding:clamp(10px,1.6vh,16px);box-shadow:0 40px 80px rgba(60,40,10,.28),0 0 0 2px #3A3630 inset;position:relative}
.phone::before{content:"";position:absolute;top:clamp(18px,2.8vh,28px);left:50%;transform:translateX(-50%);width:28%;height:clamp(24px,3.4vh,34px);background:#000;border-radius:20px;z-index:2}
.phone iframe{width:100%;height:100%;border:0;border-radius:clamp(26px,4.8vh,46px);background:#FAF4E8;display:block}
</style>
</head>
<body>
<div class="stage">
  <div class="phone"><iframe src="app.html" title="PlatePlan on a phone"></iframe></div>
</div>

</body>
</html>
