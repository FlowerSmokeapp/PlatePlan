<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF4E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1914" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PlatePlan">
<meta name="description" content="Madplan og indkøbsliste på et lille budget">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>PlatePlan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
/* Layout: ugeplan øverst som en bred tavle, derunder opskriftsbibliotek til venstre og indkøbsliste til højre. */
:root{
  --bg:#FAF4E8;
  --surface:#FFFDF8;
  --ink:#2A281F;
  --muted:#6E6758;
  --line:#E8DECB;
  --accent:#2F6143;        /* krydderurt-grøn: knapper og valgt tilstand */
  --accent-ink:#FFFFFF;
  --sun:#F2B330;           /* safran: pris og fremhævning */
  --sun-soft:#FCEBC2;
  --veg:#5E8F3E;
  --protein:#B4522F;
  --fast:#2F6B8F;
  --shadow:0 1px 2px rgba(60,45,20,.06),0 6px 18px rgba(60,45,20,.07);
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1914;--surface:#25221B;--ink:#F2EBDC;--muted:#ABA28E;--line:#3A352A;
    --accent:#86C29A;--accent-ink:#13261A;--sun:#F3BE4A;--sun-soft:#43361A;
    --veg:#9CCB7B;--protein:#EC9874;--fast:#86BFE0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1914;--surface:#25221B;--ink:#F2EBDC;--muted:#ABA28E;--line:#3A352A;
  --accent:#86C29A;--accent-ink:#13261A;--sun:#F3BE4A;--sun-soft:#43361A;
  --veg:#9CCB7B;--protein:#EC9874;--fast:#86BFE0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}
main.wrap{padding-bottom:env(safe-area-inset-bottom)}

/* Header */
header{position:sticky;top:0;padding-top:env(safe-area-inset-top);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:26px;font-weight:800}
.brand small{color:var(--muted);font-size:13px;display:block;line-height:1.2}
.logo{width:38px;height:38px;border-radius:50%;background:var(--sun);display:grid;place-items:center;box-shadow:inset 0 0 0 5px var(--surface),0 0 0 1px var(--line)}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:block}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.stepper button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;font-size:18px;font-weight:700}
.stepper button:hover{background:var(--sun-soft)}
.stepper span{min-width:92px;text-align:center;font-weight:700;font-size:14px}
.plan-badge{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700}
.plan-badge.pro{background:var(--sun);color:#2A2005;border-color:transparent}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sun{background:var(--sun);color:#2A2005}

/* Summary */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0 14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.tile b{display:block;font-family:var(--display);font-size:28px;font-weight:700;line-height:1.15}
.tile span{color:var(--muted);font-size:13px}
.tile.hi{background:var(--sun-soft);border-color:transparent}
.tile.locked b{filter:blur(6px);user-select:none}
.tile button.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;font-size:13px;text-decoration:underline}

/* Week board */
.weekhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 10px}
.weekhead h2{font-size:22px}
.weekhead .range{color:var(--muted);font-size:14px}
.weekhead .navs{margin-left:auto;display:flex;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700}
.iconbtn:hover{background:var(--sun-soft)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:212px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,background .15s}
.day.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.day header{all:unset;display:flex;justify-content:space-between;align-items:baseline;padding:0 2px}
.day .dn{font-family:var(--display);font-weight:700;font-size:15px}
.day .dd{color:var(--muted);font-size:12px}
.slot{flex:1;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;padding:10px;line-height:1.3}
.meal{position:relative;flex:1;display:flex;flex-direction:column;gap:6px;cursor:grab;border-radius:10px}
.meal img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;display:block}
.meal .t{font-weight:700;font-size:13.5px;line-height:1.25;padding:0 2px}
.meal .p{font-size:12px;color:var(--muted);padding:0 2px}
.meal .x{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,253,248,.92);color:#2A281F;font-weight:800;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.meal .x:hover{background:#fff}

/* Main split */
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;margin:32px 0 48px;align-items:start}
.sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sechead h2{font-size:22px}
.sechead .note{color:var(--muted);font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip .dot{width:8px;height:8px;border-radius:50%}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px}
select.search{flex:0 0 auto;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;box-shadow:var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:16px;font-weight:700;line-height:1.25}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:auto}
.price{font-weight:700;color:var(--ink);background:var(--sun-soft);border-radius:6px;padding:1px 7px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid currentColor}
.tag.veg{color:var(--veg)}.tag.protein{color:var(--protein)}.tag.fast{color:var(--fast)}.tag.own{color:var(--muted)}
.card.locked{position:relative;cursor:pointer}
.card.locked img{filter:saturate(.6) blur(1px)}
.lockpill{position:absolute;top:10px;left:10px;background:var(--sun);color:#2A2005;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px}
.card.add{border-style:dashed;box-shadow:none;align-items:center;justify-content:center;min-height:220px;gap:6px;color:var(--muted);font-weight:700;padding:16px;text-align:center}
.card.add b{font-size:28px;color:var(--accent);line-height:1}
.empty{color:var(--muted);padding:20px;border:1px dashed var(--line);border-radius:var(--r)}

/* Shopping list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;box-shadow:var(--shadow)}
.list h2{font-size:22px}
.listsum{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 4px;font-size:14px;color:var(--muted)}
.listsum b{font-family:var(--display);font-size:24px;color:var(--ink)}
.group h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--body);font-weight:700;margin:16px 0 4px}
.item{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.item input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.item label{cursor:pointer}
.item .amt{font-weight:700}
.item .uses{display:block;color:var(--muted);font-size:12px}
.item .kr{color:var(--muted);font-size:13px}
.item.done label,.item.done .kr{text-decoration:line-through;opacity:.5}
.listactions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.fine{color:var(--muted);font-size:12.5px;margin-top:10px}

/* Modal */
dialog{border:0;border-radius:18px;padding:0;max-width:min(640px,calc(100% - 32px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(30,25,15,.45)}
.mhead img{width:100%;aspect-ratio:2/1;object-fit:cover;display:block}
.mbody{padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px}
.mbody h2{font-size:26px}
.close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,253,248,.95);color:#2A281F;font-size:20px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.facts{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink)}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative}
.macros div{background:var(--bg);border-radius:10px;padding:8px 10px;text-align:center}
.macros b{display:block;font-family:var(--display);font-size:20px}
.macros span{font-size:12px;color:var(--muted)}
.macros.locked div{filter:blur(5px);user-select:none}
.macros .unlock{position:absolute;inset:0;display:grid;place-items:center;background:none;border:0;filter:none}
.macros .unlock span{background:var(--sun);color:#2A2005;font-weight:800;border-radius:999px;padding:6px 14px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two h3{font-size:16px;margin-bottom:6px}
.two ul,.two ol{margin:0;padding-left:18px;font-size:14.5px}
.two li{margin:3px 0}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px;min-width:56px}
.daypick button:hover{border-color:var(--accent)}
.daypick button.taken{color:var(--muted)}
.daypick button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}

.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plan{border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.plan.best{border-color:var(--sun)}
.plan b{font-family:var(--display);font-size:28px}
.plan .save{font-size:12px;font-weight:800;background:var(--sun);color:#2A2005;border-radius:999px;padding:2px 9px;align-self:flex-start}
.perks{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.perks li{display:flex;gap:8px}
.perks li::before{content:"";flex:0 0 18px;height:18px;border-radius:50%;background:var(--accent);margin-top:2px;mask:radial-gradient(circle,#000 35%,transparent 36%);-webkit-mask:radial-gradient(circle,#000 35%,transparent 36%)}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th,.cmp td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:center}
.form{display:grid;gap:10px}
.form label{font-weight:700;font-size:14px;display:grid;gap:4px}
.form input,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-weight:400}
.form .row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.form .checks{display:flex;gap:14px;flex-wrap:wrap;font-weight:400}
.form .checks label{display:flex;gap:6px;align-items:center;font-weight:600}
.err{color:var(--protein);font-size:13.5px;font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:1100px){
  .week{grid-template-columns:repeat(4,minmax(0,1fr))}
  .split{grid-template-columns:1fr}
  .list{position:static;max-height:none}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .summary{grid-template-columns:1fr 1fr}
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.plans{grid-template-columns:1fr}
  .stepper span{min-width:76px}
  .brand small{display:none}
  .form .row{grid-template-columns:1fr 1fr}
  .form .row label:first-child{grid-column:1/-1}
}
.install{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:14px 16px;display:flex;gap:12px;align-items:center;max-width:520px;margin:0 auto}
.install[hidden]{display:none}
html.framed body>header{padding-top:46px}
.install img{width:44px;height:44px;border-radius:10px;flex:0 0 auto}
.install p{margin:0;font-size:14px;line-height:1.35;flex:1}
.install p b{display:block;font-family:var(--display);font-size:16px}
.install .share{display:inline-block;width:16px;height:16px;vertical-align:-3px;border:2px solid currentColor;border-top:0;border-radius:2px;position:relative;margin:0 2px}
.install .share::before{content:"";position:absolute;left:50%;top:-6px;width:2px;height:10px;background:currentColor;transform:translateX(-50%)}
.install button.no{background:none;border:0;font-size:22px;color:var(--muted);padding:4px 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><i></i></div>
      <div><h1>PlatePlan</h1><small>Madplan og indkøbsliste på et lille budget</small></div>
    </div>
    <div class="stepper" role="group" aria-label="Antal personer">
      <button id="pMinus" aria-label="Færre personer">−</button>
      <span id="pCount" class="num" aria-live="polite">4 personer</span>
      <button id="pPlus" aria-label="Flere personer">+</button>
    </div>
    <button id="planBadge" class="plan-badge">Gratis</button>
  </div>
</header>

<main class="wrap">
  <section class="summary" id="summary" aria-label="Ugens overblik"></section>

  <section aria-labelledby="weekTitle">
    <div class="weekhead">
      <h2 id="weekTitle">Uge</h2>
      <span class="range" id="weekRange"></span>
      <div class="navs">
        <button class="iconbtn" id="wPrev" aria-label="Forrige uge">‹</button>
        <button class="iconbtn" id="wNext" aria-label="Næste uge">›</button>
        <button class="btn ghost" id="clearWeek">Ryd ugen</button>
      </div>
    </div>
    <div class="week" id="week"></div>
  </section>

  <div class="split">
    <section aria-labelledby="libTitle">
      <div class="sechead">
        <h2 id="libTitle">Opskrifter</h2>
        <span class="note" id="libNote"></span>
      </div>
      <div class="filters" role="group" aria-label="Filtre">
        <button class="chip" data-f="veg" aria-pressed="false"><span class="dot" style="background:var(--veg)"></span>Vegetar</button>
        <button class="chip" data-f="protein" aria-pressed="false"><span class="dot" style="background:var(--protein)"></span>High protein</button>
        <button class="chip" data-f="fast" aria-pressed="false"><span class="dot" style="background:var(--fast)"></span>Hurtig (højst 20 min)</button>
        <input class="search" id="q" type="search" placeholder="Søg fx kylling, linser …" aria-label="Søg i opskrifter">
        <select class="search" id="sort" aria-label="Sortér">
          <option value="price">Billigst først</option>
          <option value="time">Hurtigst først</option>
          <option value="name">Navn A–Å</option>
        </select>
      </div>
      <div class="grid" id="lib"></div>
    </section>

    <aside class="list" aria-labelledby="listTitle">
      <h2 id="listTitle">Indkøbsliste</h2>
      <div class="listsum"><span id="listMeta"></span><b class="num" id="listTotal"></b></div>
      <div id="listBody"></div>
      <div class="listactions">
        <button class="btn" id="copyList">Kopiér liste</button>
        <button class="btn ghost" id="uncheck">Fjern flueben</button>
      </div>
      <p class="fine">Prisen er beregnet efter forbrug ud fra gennemsnitlige discountpriser. Har du fx olie, salt og krydderier i skabet, er de ikke medregnet.</p>
    </aside>
  </div>
</main>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div class="install" id="install" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Data ---------- */
const GROUPS = {gront:"Frugt og grønt",kod:"Kød, fisk og tofu",mejeri:"Mejeri og æg",brod:"Brød",kol:"Kolonial",andet:"Andet"};
// pris i kr pr. enhed (g, ml, stk, dåse, fed)
const C = {
  oksekod:["Hakket oksekød 8–12 %","g",.09,"kod"], svinekod:["Hakket svinekød","g",.06,"kod"],
  kyllbryst:["Kyllingebryst","g",.11,"kod"], kylllaar:["Kyllingelår uden ben","g",.07,"kod"],
  torsk:["Torskefilet, frost","g",.12,"kod"], bacon:["Bacontern","g",.12,"kod"], tofu:["Tofu","g",.07,"kod"],
  aeg:["Æg","stk",2.5,"mejeri"], skyr:["Skyr naturel","g",.025,"mejeri"], feta:["Feta","g",.08,"mejeri"],
  ost:["Revet ost","g",.08,"mejeri"], maelk:["Letmælk","ml",.012,"mejeri"], flode:["Madlavningsfløde 9 %","ml",.03,"mejeri"],

function baseMonday(){
  const d = new Date(); d.setHours(0,0,0,0);
  const wd = (d.getDay()+6)%7;           // 0 = mandag
  d.setDate(d.getDate()-wd + (wd>=4?7:0)); // fra fredag planlægger man næste uge
  return d;
}
const BASE = baseMonday();
function weekStart(off){const d=new Date(BASE);d.setDate(d.getDate()+off*7);return d}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function wkey(off){const d=weekStart(off);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()}

    for(let i=0;i<40;i++){const a=R()*7,d=Math.sqrt(R())*fr*.85;const c=bits[i%bits.length];blob(g,cx+Math.cos(a)*d,cy+Math.sin(a)*d,3+R()*6,c,R,.4,7)}

function parseNum(s){return parseFloat(String(s).replace(",","."))}
function saveOwn(){
  const name=$("#oN").value.trim(),m=+$("#oM").value,por=Math.max(1,+$("#oP").value||4);
  const lines=$("#oI").value.split("\n").map(s=>s.trim()).filter(Boolean);
  const re=/^([\d.,]+)\s*(g|kg|ml|dl|l|stk|dåse|dåser|fed)?\s+(.+?)\s*(?:[=;]\s*([\d.,]+)\s*(?:kr\.?)?)?$/i;
  const ing=[],bad=[];S.ownCat=S.ownCat||{};
  for(const ln of lines){const mm=ln.match(re);if(!mm){bad.push(ln);continue}
    let a=parseNum(mm[1]),u=(mm[2]||"stk").toLowerCase();const nm=mm[3].trim();const pr=mm[4]?parseNum(mm[4]):null;
    if(u==="kg"){a*=1000;u="g"} if(u==="dl"){a*=100;u="ml"} if(u==="l"){a*=1000;u="ml"} if(u==="dåser")u="dåse";
    let key=Object.keys(C).find(k=>C[k][0].toLowerCase()===nm.toLowerCase()&&C[k][1]===u);
    if(!key){key="own:"+nm.toLowerCase()+":"+u;const unit=pr!=null&&a?pr/a:((S.ownCat[key]||[])[2]||0);S.ownCat[key]=[nm[0].toUpperCase()+nm.slice(1),u,unit,"andet"]}
    ing.push([key,a*4/por]);}
  if(!name){$("#oErr").textContent="Giv opskriften et navn.";return}
  if(bad.length){$("#oErr").textContent=`Linjen "${bad[0]}" kunne ikke læses. Skriv fx: 400 g pasta = 6`;return}
  if(!ing.length){$("#oErr").textContent="Tilføj mindst én ingrediens.";return}
  const t=["own"];if($("#oVeg").checked)t.push("veg");if($("#oPro").checked)t.push("protein");if(m<=20)t.push("fast");
  const steps=$("#oS").value.split("\n").map(s=>s.trim()).filter(Boolean);
  const pal=[["#C98A3A","#EAD9A6",["#7DB24A","#E05A36"]],["#B4402A","#F4EFE3",["#6FA346","#F2C94C"]],["#7DA344","#EBD38E",["#3E7A2E","#F4ECD6"]]][S.own.length%3];
  const r={id:"own-"+Date.now(),n:name,m:m||30,t,mac:null,own:true,art:[["plate","curry","salad"][S.own.length%3],...pal],i:ing,s:steps.length?steps:["Følg din egen fremgangsmåde."]};
  S.own.push(r);dlg.close();render();toast("Opskriften er gemt");
}

/* ---------- Events ---------- */
function place(id,day){
  if(!byId(id))return;
  const p=plan();p[day]=id;render();
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act;
  if(a==="remove"){e.stopPropagation();const p=plan();delete p[el.dataset.day];render();return}
  if(a==="open")openRecipe(el.dataset.id);
  if(a==="close")dlg.close();
  if(a==="paywall")openPaywall();
  if(a==="newRecipe")openNew();
  if(a==="place"){place(el.dataset.id,+el.dataset.day);dlg.close();toast(`Lagt på ${DAYS[+el.dataset.day].toLowerCase()}`)}
  if(a==="buy"){S.premium=el.dataset.p;dlg.close();render();toast("Premium er slået til")}
  if(a==="downgrade"){S.premium=false;S.off=0;dlg.close();render();toast("Du er tilbage på Gratis")}
  if(a==="delOwn"){S.own=S.own.filter(r=>r.id!==el.dataset.id);Object.values(S.plans).forEach(p=>Object.keys(p).forEach(d=>{if(p[d]===el.dataset.id)delete p[d]}));dlg.close();render()}
});
$("#planBadge").onclick=()=>S.premium?openManage():openPaywall();
$("#pMinus").onclick=()=>{if(S.persons>1){S.persons--;render()}};
$("#pPlus").onclick=()=>{if(S.persons<10){S.persons++;render()}};
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const f=c.dataset.f;S.filters=S.filters.includes(f)?S.filters.filter(x=>x!==f):[...S.filters,f];renderLib();save()});
$("#q").oninput=renderLib;$("#sort").onchange=renderLib;
$("#wPrev").onclick=()=>{if(S.off>0){S.off--;render()}else if(!S.premium)openPaywall();else{S.off--;render()}};
$("#wNext").onclick=()=>{if(!S.premium){openPaywall();return}S.off++;render()};
$("#clearWeek").onclick=()=>{const p=plan();Object.keys(p).forEach(k=>delete p[k]);render();toast("Ugen er ryddet")};
$("#listBody").addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;const w=wkey(S.off);S.checked[w]=S.checked[w]||{};S.checked[w][k]=e.target.checked;renderList();save()});
$("#uncheck").onclick=()=>{S.checked[wkey(S.off)]={};renderList();save()};
$("#copyList").onclick=async()=>{
  const items=shopping();if(!items.length){toast("Listen er tom");return}
  const txt=`Indkøbsliste, uge ${isoWeek(weekStart(S.off))} (${S.persons} pers.)\n`+Object.keys(GROUPS).map(gk=>{const g=items.filter(o=>cat(o.k)[3]===gk);return g.length?`\n${GROUPS[gk]}\n`+g.map(o=>`- ${fmtAmt(o.a,cat(o.k)[1])} ${cat(o.k)[0]}`).join("\n"):""}).join("")+`\n\nAnslået pris: ${kr(items.reduce((s,o)=>s+o.a*cat(o.k)[2],0))}`;
  try{await navigator.clipboard.writeText(txt);toast("Listen er kopieret")}catch(err){toast("Kopiering blev afvist af browseren")}
};
// træk og slip
document.addEventListener("dragstart",e=>{const c=e.target.closest("[draggable]");if(!c)return;e.dataTransfer.setData("text/plain",JSON.stringify({id:c.dataset.id,from:c.dataset.from??null}));e.dataTransfer.effectAllowed="move"});
const weekEl=$("#week");
weekEl.addEventListener("dragover",e=>{const d=e.target.closest(".day");if(!d)return;e.preventDefault();document.querySelectorAll(".day.over").forEach(x=>x!==d&&x.classList.remove("over"));d.classList.add("over")});
weekEl.addEventListener("dragleave",e=>{const d=e.target.closest(".day");if(d&&!d.contains(e.relatedTarget))d.classList.remove("over")});
weekEl.addEventListener("drop",e=>{const d=e.target.closest(".day");if(!d)return;e.preventDefault();d.classList.remove("over");
  let data;try{data=JSON.parse(e.dataTransfer.getData("text/plain"))}catch(err){return}
  const to=+d.dataset.day,p=plan();
  if(data.from!==null&&data.from!==undefined){const from=+data.from;if(from===to)return;const there=p[to];p[to]=p[from];if(there)p[from]=there;else delete p[from];render()}
  else place(data.id,to);
});

render();

/* ---------- Installér som app ---------- */
(function(){
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const framed = window.self !== window.top;
  if(framed) document.documentElement.classList.add("framed");
  if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(standalone || framed) return;
  let dismissed=false; try{dismissed=localStorage.getItem("plateplan-install")==="no"}catch(e){}
  if(dismissed) return;
  const box=$("#install");
  const show=html=>{box.innerHTML=`<img src="icons/icon-192.png" alt="">${html}<button class="no" aria-label="Luk">×</button>`;box.hidden=false;
    box.querySelector(".no").onclick=()=>{box.hidden=true;try{localStorage.setItem("plateplan-install","no")}catch(e){}}};
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  if(ios){ show(`<p><b>Gem PlatePlan på hjemmeskærmen</b>Tryk på Del <span class="share" aria-hidden="true"></span> nederst i Safari og vælg <b style="display:inline;font-size:inherit">Føj til hjemmeskærm</b>.</p>`); return; }
  window.addEventListener("beforeinstallprompt",e=>{
    e.preventDefault();
    show(`<p><b>Gem PlatePlan på hjemmeskærmen</b>Så åbner den som en app, også uden net.</p><button class="btn" id="doInstall">Installér</button>`);
    $("#doInstall").onclick=async()=>{e.prompt();await e.userChoice.catch(()=>{});box.hidden=true};
  });
})();
</script>
