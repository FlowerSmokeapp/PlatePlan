<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlatePlan</title>
<meta name="description" content="Weekly dinner plan and shopping list on a student budget.">
<meta name="theme-color" content="#FAF4E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1914" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PlatePlan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="appbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" rx="13" fill="#2F6143"/>
      <circle cx="24" cy="24" r="15" fill="#FAF4E8"/>
      <circle cx="24" cy="24" r="9.5" fill="#F2B330"/>
      <g fill="#2F6143"><circle cx="24" cy="12.2" r="1.6"/><circle cx="33.2" cy="16.6" r="1.6"/><circle cx="35.5" cy="26.6" r="1.6"/><circle cx="29.1" cy="34.6" r="1.6"/><circle cx="18.9" cy="34.6" r="1.6"/><circle cx="12.5" cy="26.6" r="1.6"/><circle cx="14.8" cy="16.6" r="1.6"/></g>
    </svg>
    <div>
      <h1>PlatePlan</h1>
      <p>A week of dinners on your budget</p>
    </div>
  </div>
  <button class="iconbtn" id="openSettings" data-act="settings" aria-label="Settings: budget, people and diet">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
</header>

<main id="main" tabindex="-1">
  <section class="view" id="view-week" aria-labelledby="weekTitle"></section>
  <section class="view" id="view-list" aria-labelledby="listTitle" hidden></section>
  <section class="view" id="view-recipes" aria-labelledby="recipesTitle" hidden></section>
  <section class="view" id="view-premium" aria-labelledby="premiumTitle" hidden></section>
</main>

<nav class="tabbar" aria-label="Main menu">
  <a href="#week" data-view="week">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>Week</span>
  </a>
  <a href="#list" data-view="list">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2.5l2.2 10.5h10.6L20.5 8H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="19.5" r="1.5" fill="currentColor"/><circle cx="16.5" cy="19.5" r="1.5" fill="currentColor"/></svg>
    <span>Shopping</span><b class="badge" id="listBadge" hidden></b>
  </a>
  <a href="#recipes" data-view="recipes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>Recipes</span>
  </a>
  <a href="#premium" data-view="premium">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>Premium</span>
  </a>
</nav>

<dialog id="sheet" aria-labelledby="sheetTitle"><div id="sheetBody"></div></dialog>
<div class="install" id="install" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="data/prices.js"></script>
<script src="data/recipes.js"></script>
<script src="js/illustrations.js"></script>
<script src="js/app.js"></script>
</body>
</html>
